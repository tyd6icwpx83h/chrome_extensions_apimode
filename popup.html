<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      /* width: 320px;
      padding: 15px;
      margin: 0;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #ffffff;
      color: #000000;
    }
    .option-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .option-row input {
      flex: 1;
    }
    .btn-small {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background-color: #f0f0f0;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #e0e0e0;
    }
    .input-with-button {
      display: flex;
      gap: 6px;
    }
    .input-with-button input {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="field">
    <label for="apiUrl">APIリクエスト (URL)</label>
    <input type="text" id="apiUrl" placeholder="https://api.example.com/data">
    <!-- 履歴選択用のドロップダウンを追加 -->
    <select id="urlHistory" style="margin-top: 4px;">
      <option value="">-- 過去に使用したURLから選択 --</option>
    </select>
  </div>

  <div class="field">
    <label for="authInfo">認証情報 (Authorization Header等)</label>
    <div class="input-with-button">
      <!-- 最初は mask (password型) にしておく -->
      <input type="password" id="authInfo" placeholder="Bearer token...">
      <button type="button" id="toggleAuthBtn" class="btn-small" title="表示/非表示切り替え">👁️</button>
    </div>
  </div>

  <div class="field">
    <label for="httpMethod">HTTPステータス (メソッド等)</label>
    <select id="httpMethod">
      <option value="GET" selected>GET</option>
      <option value="HEAD">HEAD</option>
      <option value="OPTIONS">OPTIONS</option>
      <option value="TRACE">TRACE</option>
      <option value="PUT">PUT</option>
      <option value="DELETE">DELETE</option>
      <option value="POST">POST</option>
      <option value="PATCH">PATCH</option>
      <option value="CONNECT">CONNECT</option>
    </select>
  </div>

  <div class="field">
    <label>オプション入力</label>
    <div id="optionsContainer">
      <div class="option-row">
        <input type="text" class="opt-key" placeholder="Key">
        <input type="text" class="opt-val" placeholder="Value">
        <button type="button" class="btn-small add-btn">＋</button>
        <button type="button" class="btn-small remove-btn">ー</button>
      </div>
    </div>
  </div>

  <button type="button" id="sendBtn" class="btn-submit">送信</button>

  <script src="popup.js"></script>
</body>
</html>
